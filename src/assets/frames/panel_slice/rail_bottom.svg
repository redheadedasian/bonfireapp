<svg xmlns="http://www.w3.org/2000/svg" width="100" height="12" viewBox="0 0 100 12" preserveAspectRatio="none" fill="none">
<defs>
  <linearGradient id="rail_b_edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7a4f15" stop-opacity="0.6"/>
    <stop offset="15%" stop-color="#e2ad3d"/>
    <stop offset="50%" stop-color="#f5d47a"/>
    <stop offset="85%" stop-color="#e2ad3d"/>
    <stop offset="100%" stop-color="#7a4f15" stop-opacity="0.6"/>
  </linearGradient>
</defs>
<!-- Outer gilded ridge line at bottom -->
<line x1="0" y1="8" x2="100" y2="8" stroke="url(#rail_b_edge)" stroke-width="1.2"/>
<!-- Secondary inner trim line -->
<line x1="0" y1="4" x2="100" y2="4" stroke="#68400f" stroke-width="0.75" stroke-opacity="0.85"/>
</svg>
