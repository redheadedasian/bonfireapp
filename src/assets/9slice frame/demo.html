<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ink Frame 9-Slice Demo</title>
<style>
  body {
    background: #2b2b2b;
    color: #ddd;
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    padding: 40px;
  }

  .frame {
    display: grid;
    grid-template-columns: 150px 1fr 150px;
    grid-template-rows: 150px 1fr 150px;
    width: 800px;
    height: 500px;
    resize: both;
    overflow: hidden;
    min-width: 320px;
    min-height: 320px;
    background: #fff;
  }
  .frame > img { display: block; width: 100%; height: 100%; }
  .corner-tl { grid-column: 1; grid-row: 1; }
  .corner-tr { grid-column: 3; grid-row: 1; }
  .corner-bl { grid-column: 1; grid-row: 3; }
  .corner-br { grid-column: 3; grid-row: 3; }
  .rail-top { grid-column: 2; grid-row: 1; }
  .rail-bottom { grid-column: 2; grid-row: 3; }
  .rail-left { grid-column: 1; grid-row: 2; }
  .rail-right { grid-column: 3; grid-row: 2; }
  .content {
    grid-column: 2; grid-row: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #222;
    font-size: 18px;
    text-align: center;
    padding: 20px;
  }
</style>
</head>
<body>
  <h2>Ink Frame — drag the bottom-right corner to resize</h2>
  <div class="frame" id="frame">
    <img class="corner-tl" src="corner-tl.svg" alt="">
    <img class="rail-top"  src="rail-top.svg" alt="">
    <img class="corner-tr" src="corner-tr.svg" alt="">
    <img class="rail-left" src="rail-left.svg" alt="">
    <div class="content">Dynamic content goes here</div>
    <img class="rail-right" src="rail-right.svg" alt="">
    <img class="corner-bl" src="corner-bl.svg" alt="">
    <img class="rail-bottom" src="rail-bottom.svg" alt="">
    <img class="corner-br" src="corner-br.svg" alt="">
  </div>
</body>
</html>
